name: aiops

x-backend-env: &backend-env
  DATABASE_HOST: postgres
  REDIS_URL: redis://redis:6379/0
  OLLAMA_URL: http://ollama:11434
  LOGPROXY_URL: http://logproxy:2375

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-backend: &backend
  image: ${AIOPS_IMAGE_PREFIX:-ghcr.io/mbechc/aiops}-backend:${AIOPS_VERSION:-0.2.5-dev.5}
  build:
    context: ./backend
  env_file: .env
  environment: *backend-env
  restart: unless-stopped
  networks: [internal]
  volumes:
    - ./data/fixtures:/data/fixtures:z
    - ./data/geoip:/data/geoip:z
    - ./data/update:/data/update:z
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging: *logging

# Specialist workers: same image, one container and one queue per domain, so an error,
# leak or hung Catalyst Center call in one domain cannot stall the others.
x-worker: &worker
  <<: *backend
  command: ["worker"]
  read_only: true
  tmpfs: [/tmp]
  healthcheck:
    test: ["CMD", "python", "-m", "app.workers", "--check"]
    interval: 30s
    start_period: 30s
    timeout: 10s
    retries: 5

services:
  postgres:
    image: postgres:16.16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-UTC}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redisdata:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  # Local LLM (profile "llm"): never pulled or started by the installer. An admin enables it under
  # Settings > AI assistance; the host updater then adds "llm" to COMPOSE_PROFILES and pulls the model.
  ollama:
    image: ollama/ollama:0.40.16
    profiles: ["llm"]
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "24h"
      # `ollama pull` runs inside the container: pass the appliance proxy (if any) from .env.
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    volumes:
      - ollama:/root/.ollama
    networks: [internal]
    mem_limit: ${OLLAMA_MEM_LIMIT:-10g}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
    logging: *logging

  # Read-only, allow-listed view of the Docker API for the Runners and Logs pages.
  # Only GET on /containers is permitted; no exec, no start/stop, no images, no POST.
  logproxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      POST: "0"
      INFO: "0"
      IMAGES: "0"
      NETWORKS: "0"
      VOLUMES: "0"
      EXEC: "0"
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [internal]
    mem_limit: 64m
    logging: *logging

  api:
    <<: *backend
    command: ["api"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker-default:
    <<: *worker
    environment:
      <<: *backend-env
      WORKER_NAME: default
      # legacy queues drain messages left by releases before the specialist split
      WORKER_QUEUES: run.default,default,execute
      WORKER_CONCURRENCY: "2"
    mem_limit: 1g
    cpus: 2

  worker-wireless:
    <<: *worker
    environment:
      <<: *backend-env
      WORKER_NAME: wireless
      WORKER_QUEUES: run.wireless
      WORKER_CONCURRENCY: "2"
    mem_limit: 2g
    cpus: 4

  worker-inventory:
    <<: *worker
    environment:
      <<: *backend-env
      WORKER_NAME: inventory
      WORKER_QUEUES: run.inventory
      WORKER_CONCURRENCY: "2"
    mem_limit: 2g
    cpus: 4

  worker-health:
    <<: *worker
    environment:
      <<: *backend-env
      WORKER_NAME: health
      WORKER_QUEUES: run.health
      WORKER_CONCURRENCY: "2"
    mem_limit: 1g
    cpus: 2

  scheduler:
    <<: *backend
    command: ["scheduler"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-m", "app.scheduler", "--check"]
      interval: 30s
      timeout: 10s
      retries: 5

  web:
    image: ${AIOPS_IMAGE_PREFIX:-ghcr.io/mbechc/aiops}-web:${AIOPS_VERSION:-0.2.5-dev.5}
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./certs:/etc/nginx/certs:ro,z
    networks: [internal]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *logging

  # Simulated Catalyst Center releases for testing without a lab (profile "mock").
  mockcc-23:
    <<: *backend
    profiles: ["mock"]
    command: ["mockcc"]
    environment:
      MOCK_CC_RELEASE: "2.3.5.6"
      MOCK_CC_SEED: "23"
    depends_on: []
    volumes: []
    mem_limit: 768m

  mockcc-31:
    <<: *backend
    profiles: ["mock"]
    command: ["mockcc"]
    environment:
      MOCK_CC_RELEASE: "3.1.3.0"
      MOCK_CC_SEED: "31"
    depends_on: []
    volumes: []
    mem_limit: 768m

volumes:
  pgdata:
  redisdata:
  ollama:

networks:
  internal:
    driver: bridge
